# =====================================================================
#  相册数据（Meow 主题 external 相册模式）
#  - name   相册名（显示在相册封面）
#  - cover  相册封面图（可以是外链 URL 或本地路径 /images/xxx.jpg）
#  - span   相册封面在合集页占的列宽（可选，默认自动）
#  - column 相册内图片的列数
#  - images 相册内图片列表：标题: 图片地址
#  想换图：把图片放到 source/images/ 下用本地路径，或直接换成图床外链
# =====================================================================

albums_list:
  - name: 力量训练
